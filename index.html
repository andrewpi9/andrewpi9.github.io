<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Andrew Pi</title>
    <meta name="description" content="Andrew Pi — CS and Economics at UNC. Portfolio and web projects." />
    <meta name="theme-color" content="#0f172a" />
    <style>
      :root {
        --color-primary: #c2eaba;
        --color-text: #e2e8f0;
        --color-text-light: #94a3b8;
        --color-background: #0f172a;
        --color-surface: #1e293b;
        --color-border: #334155;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        line-height: 1.6;
        color: var(--color-text);
        background-color: var(--color-background);
        -webkit-font-smoothing: antialiased;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 1.5rem;
      }

      main {
        width: 100%;
        max-width: 32rem;
      }

      h1 {
        font-size: 2.25rem;
        line-height: 1.2;
        margin-bottom: 0.5rem;
      }

      .tagline {
        color: var(--color-text-light);
        margin-bottom: 2.5rem;
      }

      ul {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      a.entry {
        display: block;
        padding: 1.25rem 1.5rem;
        background-color: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: 0.5rem;
        color: var(--color-text);
        text-decoration: none;
        transition: border-color 150ms ease, transform 150ms ease;
      }

      a.entry:hover,
      a.entry:focus-visible {
        border-color: var(--color-primary);
        transform: translateY(-2px);
      }

      .entry-name {
        font-weight: 600;
        margin-bottom: 0.125rem;
      }

      .entry-desc {
        color: var(--color-text-light);
        font-size: 0.875rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Andrew Pi</h1>
      <p class="tagline">CS and Economics at UNC.</p>

      <ul>
        <li>
          <a class="entry" href="/portfolio/">
            <div class="entry-name">Portfolio</div>
            <div class="entry-desc">About me, my projects, and what I'm working on.</div>
          </a>
        </li>
        <li>
          <a class="entry" href="/wordle/">
            <div class="entry-name">Wordle</div>
            <div class="entry-desc">A playable Wordle clone built with vanilla JavaScript.</div>
          </a>
        </li>
      </ul>
    </main>
  </body>
</html>
